name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches the version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version of package.json ($version)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Check that dist/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo '::error::dist/ is outdated: run "npm run compile" and commit the result before tagging.'
            exit 1
          fi
      - run: npm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jsdocgen-*.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
