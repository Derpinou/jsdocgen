name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check that dist/ matches the sources
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo '::error::dist/ is outdated: run "npm run compile" and commit the result.'
            exit 1
          fi

  install:
    name: Install from GitHub
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install this commit and document a TypeScript file
        run: |
          mkdir -p project/src && cd project
          npm init -y > /dev/null
          npm install --save-dev "github:${GITHUB_REPOSITORY}#${GITHUB_SHA}"
          printf '/** A client */\nexport class Client {\n\t/**\n\t * The name\n\t * @type {string}\n\t */\n\tname: string = "client";\n}\n' > src/Client.ts
          npx docgen --source src --output docs.json
          node -e 'const docs = require("./docs.json"); if (docs.classes[0].props[0].meta.line !== 7) throw new Error(JSON.stringify(docs));'
